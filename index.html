<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#730d1f" />
  <meta name="description" content="Walking directions around PUP Sta. Mesa from the PolyNav kiosk." />
  <title>PolyNav Route</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    PolyNav phone page (static, hosted on GitHub Pages).
    Built by polynav-repo/scripts/build-phone-site.js: do not edit the copy in the
    published folder, edit polynav-repo/phone-site/ and rebuild.
  -->
  <header class="top">
    <div class="brand-mark" aria-hidden="true">P</div>
    <div class="brand-text">
      <strong>PolyNav</strong>
      <span>PUP Sta. Mesa Navigation</span>
    </div>
  </header>

  <main id="app" class="page" aria-live="polite">
    <section class="status">
      <span class="spinner"></span>
      <p>Loading…</p>
    </section>
  </main>

  <noscript>
    <p class="noscript">Please turn on JavaScript to see your route.</p>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
